<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexa</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar (Claude: #1f1e1d, wordmark, new chat, recents) -->
    <aside id="sidebar">
      <div class="sb-brand"><span class="star">✻</span> <span class="wordmark">Vexa</span></div>
      <button id="new-chat" title="New chat">+ New chat</button>
      <div class="sb-label">Recents</div>
      <nav id="session-list"></nav>
      <div class="sb-footer">
        <div class="model-chip"><span class="dot"></span><span id="model-label">connecting…</span></div>
      </div>
    </aside>

    <!-- Main (Claude: #262624, centered 768px column) -->
    <main id="main">
      <div id="chat-scroll">
        <div id="column">
          <div id="welcome">
            <div class="greet-star">✻</div>
            <h1 class="greeting">Good evening</h1>
            <p class="sub">What are we building today?</p>
          </div>
        </div>
      </div>

      <!-- Composer (Claude: large rounded box, toolbar row) -->
      <div id="composer-wrap">
        <div id="permission-bar" class="hidden">
          <span id="permission-text"></span>
          <button id="perm-allow" class="btn-accent">Allow</button>
          <button id="perm-deny" class="btn-ghost">Deny</button>
        </div>
        <div id="composer">
          <textarea id="input" rows="1" placeholder="How can I help you today?"></textarea>
          <div class="composer-toolbar">
            <div class="left">
              <button id="new-session" class="icon-btn" title="New session">＋</button>
              <span class="hint">Shift+Enter for newline</span>
            </div>
            <div class="right">
              <button id="stop" class="btn-stop hidden" title="Interrupt">■ stop</button>
              <button id="send" class="btn-accent send-btn" title="Send">↑</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
