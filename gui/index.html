<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexa Code</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="topbar">
    <span class="logo">✻</span>
    <span id="model-label">connecting…</span>
    <span id="cwd-label" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    <button id="new-session" class="secondary" style="padding:3px 10px;font-size:11px;">+ new</button>
  </header>
  <main id="chat" aria-live="polite">
    <div id="welcome">
      <div style="font-size:26px;color:var(--accent);">✻</div>
      <div style="font-weight:600;margin:4px 0;">Welcome to Vexa Code</div>
      <div style="color:var(--dim);font-size:13px;">a coding agent for your desktop — any model, any provider</div>
      <div style="color:var(--dim);font-size:12px;margin-top:10px;">try: "explain this repo" · "fix the failing test" · "/help"</div>
    </div>
  </main>
  <div id="permission-bar" class="hidden">
    <div id="permission-text"></div>
    <button id="perm-allow">Allow</button>
    <button id="perm-deny" class="secondary">Deny</button>
  </div>
  <footer>
    <textarea id="input" rows="1" placeholder="Ask Vexa to build, fix, or explain something…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send" title="Send">↑</button>
    <button id="stop" title="Interrupt" class="hidden">■</button>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
